# Load optional local environment overrides.
spring.config.import=optional:file:.env[.properties]

# Mysql Database Configuration :-
spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3308}/${DATABASE_NAME:hirehub}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Hibernate Configuration related to Database Schema ---------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
#-------------------------------------------------------------------------------

# Caching Configuration Properties ----------------------------------------------
cache.jobs.ttl-minutes=10
cache.jobs.max-size=5000
cache.companies.ttl-minutes=10
cache.companies.max-size=500
cache.roles.ttl-days=1
cache.roles.max-size=100

# ------------------------------------------------------------------------------

# Database Migration Properties ------------------------------------------------
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3
#-------------------------------------------------------------------------------

# CORS Configuration ------------------------------------------------------------
app.cors.allowed-origins=http://localhost:5173
app.cors.allowed-methods=*
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600
#---------------------------------------------------------------------------------

# Monitoring and Actuators Configuration -----------------------------------------
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/jobportal/actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.configprops.show-values=never
management.endpoint.env.show-values=never

management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Backend Project for Job Portal backend application
info.app.version=1.0.0
info.app.contact.email=support@hirehub.com
info.developer.name=PremKapadne

management.endpoint.shutdown.access=none

management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
management.otlp.metrics.export.step=10s

management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.tracing.sampling.probability=1.0

management.opentelemetry.logging.export.otlp.endpoint=http://localhost:4318/v1/logs

#-------------------------------------------------------------------------------------

# Docker Compose Commands :-
spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.start.command=up
spring.docker.compose.stop.command=stop

