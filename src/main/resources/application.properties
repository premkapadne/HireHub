# Defining Name For Application :-
spring.application.name=HireHub

# Defining Port Number :-
server.port=8080

# Mysql Database Configuration :-
spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3307}/${DATABASE_NAME:hirehub}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}

# Enable SQL Query Logging :-
spring.jpa.show-sql=${SHOW_SQL:true}

# Format SQL for better readability :-
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}

# Hibernate Configuration related to Database Schema :-
spring.jpa.hibernate.ddl-auto=none

# Docker Compose Commands :-
# spring.docker.compose.file=jobportal-compose.yml  : If the compose.yml file is in different location
spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.start.command=up
spring.docker.compose.stop.command=stop

