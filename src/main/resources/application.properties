# All Logging Configuration :-

# Logging Pattern Configuration :- Defines the format/pattern in which logs will be displayed in the console.
logging.pattern.console=${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}

# Root Logging Level :- Sets the default logging level for the entire application.
# logging.level.root=${LOG_LEVEL:INFO}

# Application-Specific Logging Level :-
# Sets the logging level only for classes/packages inside the Hire Hub application.
# This allows us to control application logs separately from other libraries.
# logging.level.com.hirehub=${LOG_LEVEL:INFO}

# Logging Group Configuration :-
# Creates a custom logging group named "hirehub_error".
# The group contains the Security and Contact packages.
# This allows us to configure the logging level of multiple packages together.
# logging.group.hirehub_error=com.hirehub.security,com.hirehub.contact

# Logging Level for Hire Hub Error Group :-
# Sets the logging level for all packages included in the "hirehub_error" group.
# ERROR means only ERROR-level messages will be logged.
# Can be overridden using the LOG_LEVEL_ERROR environment variable.
# logging.level.hirehub_error=${LOG_LEVEL_ERROR:ERROR}

# File Logging Configuration :- Writes application logs to the specified file.
# logging.file.name=logs/hirehub.log

# JSON File Logging Pattern :-
# Defines the format of logs when they are written to a file.
# The log is formatted as JSON, which is useful for log monitoring and analysis tools.
# logging.pattern.file={"timestamp":"%d{yyyy-MM-dd HH:mm:ss}","level":"%p","logger":"%c","message":"%m"}
