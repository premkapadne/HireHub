services:
  dbservice:
    image: mysql:8.0
    container_name: hirehubdb

    ports:
      - "3407:3306"

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hirehub

    volumes:
      - D:\HireHub\Database:/var/lib/mysql

  grafana-lgtm:
    image: 'grafana/otel-lgtm:latest'
    ports:
      - '3000:3000'
      - '4317:4317'
      - '4318:4318'